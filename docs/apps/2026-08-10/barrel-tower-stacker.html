<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Wine Barrel Tower Stacker — Physics Stacking Game</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  body { background: #0d0a08; color: #d4c4a8; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; height: 100vh; user-select: none; }

  .disclaimer { background: #1a1610; border-bottom: 1px solid #3a3020; color: #c9a060; padding: 0.75rem 1rem; text-align: center; font-size: 0.85rem; font-family: system-ui, sans-serif; position: sticky; top: 0; z-index: 100; }
  .disclaimer strong { font-weight: 600; }

  #canvas-container { position: fixed; inset: 0; z-index: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  #ui-layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 10; }

  #top-bar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; pointer-events: none;
  }

  .stat-box {
    background: rgba(20, 16, 12, 0.88);
    border: 1px solid #4a3a28;
    border-radius: 10px;
    padding: 8px 14px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .stat-box .label { font-size: 0.65rem; color: #8a7a60; text-transform: uppercase; letter-spacing: 0.08em; }
  .stat-box .value { font-size: 1.4rem; font-weight: 700; color: #e8c878; line-height: 1.1; }
  .stat-box .value.small { font-size: 1.1rem; }

  #score-box { pointer-events: auto; }
  #level-box { pointer-events: auto; }

  #crane-indicator {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    pointer-events: none; z-index: 5;
    font-size: 0.8rem; color: #c9a060; background: rgba(20,16,12,0.7);
    padding: 4px 12px; border-radius: 6px; border: 1px solid #4a3a28;
    opacity: 0; transition: opacity 0.3s;
  }

  #instructions {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(20, 16, 12, 0.88);
    border: 1px solid #4a3a28;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 0.85rem; color: #b8a888;
    pointer-events: auto;
    text-align: center;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #instructions kbd {
    background: #2a1e14; border: 1px solid #5a4a30; border-radius: 4px;
    padding: 2px 8px; font-size: 0.8rem; color: #e8c878; font-family: monospace;
  }

  #game-over-overlay {
    position: absolute; inset: 0;
    background: rgba(10, 8, 6, 0.85);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: auto; z-index: 20;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0; visibility: hidden;
    transition: opacity 0.4s, visibility 0.4s;
  }
  #game-over-overlay.show { opacity: 1; visibility: visible; }

  #game-over-overlay h2 {
    font-size: 2.2rem; color: #e8c878; margin-bottom: 8px;
    text-shadow: 0 2px 12px rgba(232, 200, 120, 0.3);
  }
  #game-over-overlay .final-score {
    font-size: 1.1rem; color: #b8a888; margin-bottom: 4px;
  }
  #game-over-overlay .final-score span { color: #e8c878; font-weight: 700; }
  #game-over-overlay .rank {
    font-size: 1.3rem; font-weight: 700; margin: 12px 0 20px;
  }
  #restart-btn {
    background: linear-gradient(135deg, #8b5a2b, #c9a060);
    color: #1a1208; border: none; border-radius: 10px;
    padding: 12px 32px; font-size: 1.1rem; font-weight: 700;
    cursor: pointer; pointer-events: auto;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(201, 160, 96, 0.2);
  }
  #restart-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(201, 160, 96, 0.35); }
  #restart-btn:active { transform: translateY(0); }

  #wind-indicator {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
    pointer-events: none; z-index: 5;
    font-size: 0.75rem; color: #c9a060;
    background: rgba(20,16,12,0.7);
    padding: 4px 14px; border-radius: 6px; border: 1px solid #4a3a28;
    opacity: 0; transition: opacity 0.5s;
    white-space: nowrap;
  }

  #combo-display {
    position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
    pointer-events: none; z-index: 5;
    font-size: 2rem; font-weight: 700; color: #e8c878;
    text-shadow: 0 2px 8px rgba(232, 200, 120, 0.4);
    opacity: 0; transition: opacity 0.3s, transform 0.3s;
  }

  @media (max-width: 768px) {
    html, body { overflow-y: auto; height: auto; }
    #canvas-container {
      position: relative !important;
      width: 100% !important;
      height: 52vh !important;
      min-height: 300px;
      max-height: 420px;
      inset: auto !important;
      z-index: 0;
    }
    canvas { width: 100% !important; height: 100% !important; }
    #ui-layer { position: relative !important; inset: auto !important; pointer-events: auto; }
    #top-bar {
      position: relative !important; top: auto !important; left: auto !important; right: auto !important;
      padding: 8px 12px;
    }
    #instructions {
      position: relative !important; bottom: auto !important; left: auto !important;
      transform: none !important; margin: 8px auto; width: calc(100% - 24px);
    }
    #game-over-overlay {
      position: relative !important; inset: auto;
      min-height: 300px; border-radius: 0;
    }
    #wind-indicator { top: 56px; }
    .stat-box .value { font-size: 1.2rem; }
  }
</style>
</head>
<body>
<div class="disclaimer"><strong>⚠ Disclaimer:</strong> Unlisted Hermes Agent AI mini-apps. Experimental and not professionally validated. Do not rely on them.</div>

<div id="canvas-container"></div>

<div id="ui-layer">
  <div id="top-bar">
    <div class="stat-box" id="score-box">
      <div class="label">Score</div>
      <div class="value" id="score-value">0</div>
    </div>
    <div class="stat-box" id="level-box">
      <div class="label">Level · Height</div>
      <div class="value small" id="level-value">1 · 0m</div>
    </div>
  </div>

  <div id="wind-indicator"></div>
  <div id="combo-display"></div>
  <div id="crane-indicator">Drop!</div>

  <div id="instructions">
    <kbd>Click</kbd> or <kbd>Space</kbd> to drop the barrel · Stack them high!
  </div>

  <div id="game-over-overlay">
    <h2>Barrel Tower Collapsed!</h2>
    <div class="final-score">Score: <span id="final-score">0</span></div>
    <div class="final-score">Best Streak: <span id="final-streak">0</span></div>
    <div class="final-score">Max Height: <span id="final-height">0m</span></div>
    <div class="rank" id="rank-text">Cellar Hand</div>
    <button id="restart-btn">Play Again</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ─── Matter.js setup ───
  var M = Matter;
  var Engine = M.Engine, World = M.World, Bodies = M.Bodies, Body = M.Body,
      Composite = M.Composite, Events = M.Events, Vector = M.Vector;

  var container = document.getElementById('canvas-container');
  var canvas = document.createElement('canvas');
  container.appendChild(canvas);
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, DPR = window.devicePixelRatio || 1;

  function resize() {
    var rect = container.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', function() { resize(); repositionGround(); });

  // ─── Physics world ───
  var engine = Engine.create();
  engine.gravity.y = 1.0;
  var world = engine.world;

  // Ground & walls
  var groundY = 0;
  var ground, leftWall, rightWall;

  function repositionGround() {
    groundY = H - 40;
    if (ground) World.remove(world, ground);
    if (leftWall) World.remove(world, leftWall);
    if (rightWall) World.remove(world, rightWall);
    ground = Bodies.rectangle(W / 2, groundY + 20, W * 2, 40, { isStatic: true, friction: 0.9, label: 'ground' });
    leftWall = Bodies.rectangle(-25, H / 2, 50, H * 3, { isStatic: true, label: 'wall' });
    rightWall = Bodies.rectangle(W + 25, H / 2, 50, H * 3, { isStatic: true, label: 'wall' });
    World.add(world, [ground, leftWall, rightWall]);
  }
  repositionGround();

  // ─── Game state ───
  var BARREL_W = 52, BARREL_H = 36;
  var state = {
    score: 0,
    level: 1,
    streak: 0,
    bestStreak: 0,
    maxHeight: 0,
    barrels: [],
    droppedCount: 0,
    craneX: 0,
    craneDir: 1,
    craneSpeed: 2.5,
    craneRange: 0,
    currentBarrel: null,
    currentBarrelHue: 25,
    gameOver: false,
    waitingForNext: false,
    dropTimer: 0,
    windForce: 0,
    windPhase: 0,
    shakeAmount: 0,
    perfectDrops: 0,
    totalDrops: 0,
    particles: [],
    comboText: '',
    comboTimer: 0,
  };

  function initGame() {
    // Clear existing barrels
    state.barrels.forEach(function(b) { World.remove(world, b); });
    state.barrels = [];
    state.score = 0;
    state.level = 1;
    state.streak = 0;
    state.bestStreak = 0;
    state.maxHeight = 0;
    state.droppedCount = 0;
    state.gameOver = false;
    state.waitingForNext = false;
    state.perfectDrops = 0;
    state.totalDrops = 0;
    state.particles = [];
    state.comboTimer = 0;
    state.shakeAmount = 0;
    state.windForce = 0;
    state.windPhase = 0;
    document.getElementById('game-over-overlay').classList.remove('show');
    spawnBarrel();
    updateUI();
  }

  function spawnBarrel() {
    state.craneRange = W * 0.35;
    state.craneX = W / 2;
    state.craneDir = Math.random() > 0.5 ? 1 : -1;
    state.craneSpeed = 2.0 + state.level * 0.35;
    if (state.craneSpeed > 6) state.craneSpeed = 6;

    // Create a sensor body at crane position (for visual tracking)
    state.currentBarrelHue = 20 + Math.random() * 20;
    state.currentBarrel = {
      x: W / 2,
      y: 60,
      hue: state.currentBarrelHue,
      w: BARREL_W,
      h: BARREL_H,
      angle: 0,
    };
    state.waitingForNext = false;
  }

  function dropBarrel() {
    if (state.gameOver || state.waitingForNext || !state.currentBarrel) return;

    var bx = state.currentBarrel.x;
    var by = state.currentBarrel.y;
    var hue = state.currentBarrel.hue;

    var barrel = Bodies.rectangle(bx, by, BARREL_W, BARREL_H, {
      density: 0.0015,
      friction: 0.7,
      frictionAir: 0.001,
      restitution: 0.15,
      angle: 0,
      label: 'barrel',
    });
    barrel.hue = hue;
    barrel.dropped = true;
    barrel.settled = false;
    barrel.dropIndex = state.droppedCount;

    World.add(world, barrel);
    state.barrels.push(barrel);
    state.droppedCount++;
    state.totalDrops++;
    state.waitingForNext = true;
    state.currentBarrel = null;

    // Check alignment for streak
    var topBarrel = getTopBarrel();
    if (topBarrel) {
      var dx = Math.abs(bx - topBarrel.position.x);
      if (dx < 12) {
        state.streak++;
        state.perfectDrops++;
        if (state.streak > state.bestStreak) state.bestStreak = state.streak;
        var bonus = 50 + state.streak * 25;
        state.score += bonus;
        showCombo('PERFECT! +' + bonus);
        spawnParticles(bx, by, '#e8c878', 12);
      } else if (dx < 26) {
        state.streak++;
        if (state.streak > state.bestStreak) state.bestStreak = state.streak;
        state.score += 20 + state.streak * 10;
        showCombo('Nice! +' + (20 + state.streak * 10));
        spawnParticles(bx, by, '#c9a060', 6);
      } else {
        state.streak = 0;
        state.score += 10;
      }
    } else {
      // First barrel
      var groundDx = Math.abs(bx - W / 2);
      if (groundDx < 15) {
        state.streak++;
        state.perfectDrops++;
        if (state.streak > state.bestStreak) state.bestStreak = state.streak;
        state.score += 50;
        showCombo('PERFECT! +50');
        spawnParticles(bx, groundY, '#e8c878', 12);
      } else {
        state.streak = 0;
        state.score += 10;
      }
    }

    // Check if barrel falls off
    setTimeout(function() {
      if (state.gameOver) return;
      // Check if any barrel is below ground or off screen
      checkGameOver();
      // Spawn next
      if (!state.gameOver) {
        spawnBarrel();
      }
    }, 900);

    updateUI();
  }

  function getTopBarrel() {
    var top = null;
    var topY = groundY;
    state.barrels.forEach(function(b) {
      if (b.position.y < topY && !b._fallen) {
        topY = b.position.y;
        top = b;
      }
    });
    return top;
  }

  function checkGameOver() {
    var fallen = false;
    state.barrels.forEach(function(b) {
      if (b.position.y > groundY + 100 || b.position.x < -60 || b.position.x > W + 60) {
        if (!b._fallen) {
          b._fallen = true;
          fallen = true;
        }
      }
    });

    if (fallen) {
      state.gameOver = true;
      state.shakeAmount = 15;
      showGameOver();
    }
  }

  function showGameOver() {
    document.getElementById('final-score').textContent = state.score;
    document.getElementById('final-streak').textContent = state.bestStreak;
    var heightM = Math.round(state.maxHeight / 36 * 0.9 * 10) / 10;
    document.getElementById('final-height').textContent = heightM + 'm';

    var rank = 'Cellar Hand';
    var rankColor = '#8a7a60';
    if (state.score >= 2000) { rank = 'Master Cooper'; rankColor = '#e8c878'; }
    else if (state.score >= 1200) { rank = 'Head Cellar Master'; rankColor = '#d4a858'; }
    else if (state.score >= 700) { rank = 'Senior Cellar Hand'; rankColor = '#c9a060'; }
    else if (state.score >= 350) { rank = 'Apprentice Cooper'; rankColor = '#b89048'; }
    else if (state.score >= 150) { rank = 'Winery Worker'; rankColor = '#a08038'; }

    var rankEl = document.getElementById('rank-text');
    rankEl.textContent = rank;
    rankEl.style.color = rankColor;

    document.getElementById('game-over-overlay').classList.add('show');
  }

  function showCombo(text) {
    state.comboText = text;
    state.comboTimer = 60;
    var el = document.getElementById('combo-display');
    el.textContent = text;
    el.style.opacity = '1';
    el.style.transform = 'translate(-50%, -50%) scale(1.2)';
    setTimeout(function() {
      el.style.opacity = '0';
      el.style.transform = 'translate(-50%, -50%) scale(1)';
    }, 800);
  }

  function spawnParticles(x, y, color, count) {
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = 2 + Math.random() * 4;
      state.particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        life: 1.0,
        color: color,
        size: 2 + Math.random() * 3,
      });
    }
  }

  function updateUI() {
    document.getElementById('score-value').textContent = state.score;
    var heightPx = 0;
    if (state.barrels.length > 0) {
      var minY = groundY;
      state.barrels.forEach(function(b) {
        if (!b._fallen && b.position.y < minY) minY = b.position.y;
      });
      heightPx = groundY - minY;
    }
    state.maxHeight = Math.max(state.maxHeight, heightPx);
    var heightM = Math.round(heightPx / 36 * 0.9 * 10) / 10;
    state.level = Math.floor(state.droppedCount / 5) + 1;
    document.getElementById('level-value').textContent = state.level + ' · ' + heightM + 'm';
  }

  // ─── Input ───
  function handleInput(e) {
    if (e) e.preventDefault();
    if (state.gameOver) return;
    dropBarrel();
    // Flash crane indicator
    var ci = document.getElementById('crane-indicator');
    ci.style.opacity = '1';
    setTimeout(function() { ci.style.opacity = '0'; }, 200);
  }

  canvas.addEventListener('click', handleInput);
  canvas.addEventListener('touchstart', function(e) { e.preventDefault(); handleInput(); }, { passive: false });
  document.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      handleInput();
    }
  });

  document.getElementById('restart-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    initGame();
  });

  // ─── Rendering ───
  function drawBarrel(x, y, angle, hue, w, h, isGhost) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    var alpha = isGhost ? 0.5 : 1.0;
    ctx.globalAlpha = alpha;

    // Barrel body — rounded rectangle
    var rx = w / 2, ry = h / 2;
    var r = 8;

    // Shadow
    if (!isGhost) {
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 6;
      ctx.shadowOffsetY = 3;
    }

    // Main body gradient
    var grad = ctx.createLinearGradient(0, -ry, 0, ry);
    grad.addColorStop(0, 'hsl(' + hue + ', 45%, 38%)');
    grad.addColorStop(0.5, 'hsl(' + hue + ', 50%, 30%)');
    grad.addColorStop(1, 'hsl(' + hue + ', 45%, 22%)');
    ctx.fillStyle = grad;

    // Rounded rect path
    ctx.beginPath();
    ctx.moveTo(-rx + r, -ry);
    ctx.lineTo(rx - r, -ry);
    ctx.quadraticCurveTo(rx, -ry, rx, -ry + r);
    ctx.lineTo(rx, ry - r);
    ctx.quadraticCurveTo(rx, ry, rx - r, ry);
    ctx.lineTo(-rx + r, ry);
    ctx.quadraticCurveTo(-rx, ry, -rx, ry - r);
    ctx.lineTo(-rx, -ry + r);
    ctx.quadraticCurveTo(-rx, -ry, -rx + r, -ry);
    ctx.closePath();
    ctx.fill();

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    // Barrel staves (vertical lines)
    ctx.strokeStyle = 'hsla(' + hue + ', 30%, 15%, 0.5)';
    ctx.lineWidth = 1;
    var staveCount = 5;
    for (var i = 1; i < staveCount; i++) {
      var sx = -rx + (w / staveCount) * i;
      ctx.beginPath();
      ctx.moveTo(sx, -ry + 2);
      ctx.lineTo(sx, ry - 2);
      ctx.stroke();
    }

    // Barrel hoops (horizontal bands)
    ctx.strokeStyle = 'hsla(' + hue + ', 20%, 50%, 0.7)';
    ctx.lineWidth = 2.5;
    var hoopY1 = -ry * 0.55;
    var hoopY2 = ry * 0.55;
    ctx.beginPath();
    ctx.moveTo(-rx + 2, hoopY1);
    ctx.lineTo(rx - 2, hoopY1);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-rx + 2, hoopY2);
    ctx.lineTo(rx - 2, hoopY2);
    ctx.stroke();

    // Top highlight
    ctx.strokeStyle = 'hsla(' + hue + ', 55%, 55%, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-rx + r, -ry + 1);
    ctx.lineTo(rx - r, -ry + 1);
    ctx.stroke();

    // Bung hole (tap)
    ctx.fillStyle = 'hsla(' + hue + ', 20%, 12%, 0.8)';
    ctx.beginPath();
    ctx.ellipse(rx * 0.35, 0, 4, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawCrane(x) {
    ctx.save();
    // Crane rail at top
    ctx.strokeStyle = '#4a3a28';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 35);
    ctx.lineTo(W, 35);
    ctx.stroke();

    // Rail supports
    ctx.fillStyle = '#3a2a1c';
    for (var i = 0; i < 5; i++) {
      var sx = (W / 4) * i;
      ctx.fillRect(sx - 2, 35, 4, 8);
    }

    // Crane trolley
    ctx.fillStyle = '#5a4a30';
    ctx.fillRect(x - 18, 28, 36, 14);
    ctx.strokeStyle = '#7a6a40';
    ctx.lineWidth = 1;
    ctx.strokeRect(x - 18, 28, 36, 14);

    // Cable
    ctx.strokeStyle = '#6a5a3a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, 42);
    ctx.lineTo(x, 60);
    ctx.stroke();

    // Hook
    ctx.fillStyle = '#8a7a50';
    ctx.beginPath();
    ctx.arc(x, 55, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawBackground() {
    // Dark cellar gradient
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a1208');
    grad.addColorStop(0.4, '#1e1408');
    grad.addColorStop(0.8, '#15100a');
    grad.addColorStop(1, '#0d0a06');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Stone wall texture (simple bricks)
    ctx.save();
    ctx.globalAlpha = 0.06;
    ctx.strokeStyle = '#c9a060';
    ctx.lineWidth = 1;
    var brickH = 24;
    var brickW = 48;
    for (var row = 0; row * brickH < H - 40; row++) {
      var offset = (row % 2) * (brickW / 2);
      for (var col = -1; col * brickW + offset < W; col++) {
        var bx = col * brickW + offset;
        var by = row * brickH;
        ctx.strokeRect(bx, by, brickW, brickH);
      }
    }
    ctx.restore();

    // Ambient light glow at top center
    var lightGrad = ctx.createRadialGradient(W / 2, 0, 0, W / 2, 0, W * 0.4);
    lightGrad.addColorStop(0, 'rgba(232, 200, 120, 0.08)');
    lightGrad.addColorStop(1, 'rgba(232, 200, 120, 0)');
    ctx.fillStyle = lightGrad;
    ctx.fillRect(0, 0, W, H * 0.5);

    // Ground — wooden cellar floor
    var floorGrad = ctx.createLinearGradient(0, groundY, 0, H);
    floorGrad.addColorStop(0, '#3a2a18');
    floorGrad.addColorStop(0.3, '#2a1e10');
    floorGrad.addColorStop(1, '#1a1208');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, groundY, W, 40);

    // Floor planks
    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.strokeStyle = '#5a4a28';
    ctx.lineWidth = 1;
    var plankW = 60;
    for (var p = 0; p * plankW < W; p++) {
      ctx.beginPath();
      ctx.moveTo(p * plankW, groundY);
      ctx.lineTo(p * plankW, H);
      ctx.stroke();
    }
    ctx.restore();

    // Floor top edge highlight
    ctx.strokeStyle = '#5a4a28';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();
  }

  function drawWind() {
    if (Math.abs(state.windForce) < 0.05) return;
    ctx.save();
    ctx.globalAlpha = 0.15;
    var dir = state.windForce > 0 ? 1 : -1;
    var intensity = Math.min(Math.abs(state.windForce) / 0.3, 1);
    ctx.strokeStyle = '#c9a060';
    ctx.lineWidth = 1;
    for (var i = 0; i < 8; i++) {
      var y = 80 + i * 40 + Math.sin(state.windPhase + i) * 10;
      if (y > groundY - 20) continue;
      var xStart = (state.windPhase * 50 * dir + i * 80) % (W + 100);
      if (xStart < 0) xStart += W + 100;
      xStart -= 50;
      var len = 30 + intensity * 40;
      ctx.globalAlpha = 0.08 + intensity * 0.1;
      ctx.beginPath();
      ctx.moveTo(xStart, y);
      ctx.lineTo(xStart + len * dir, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawParticles() {
    state.particles = state.particles.filter(function(p) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.25;
      p.life -= 0.02;
      if (p.life <= 0) return false;
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      return true;
    });
  }

  function drawHeightMarkers() {
    if (state.barrels.length === 0) return;
    var minY = groundY;
    state.barrels.forEach(function(b) {
      if (!b._fallen && b.position.y < minY) minY = b.position.y;
    });
    var heightPx = groundY - minY;
    if (heightPx < 20) return;

    ctx.save();
    ctx.globalAlpha = 0.3;
    ctx.strokeStyle = '#c9a060';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(0, minY);
    ctx.lineTo(W, minY);
    ctx.stroke();
    ctx.setLineDash([]);

    // Height label
    var heightM = Math.round(heightPx / 36 * 0.9 * 10) / 10;
    ctx.fillStyle = 'rgba(20,16,12,0.8)';
    ctx.fillRect(8, minY - 22, 70, 18);
    ctx.strokeStyle = '#4a3a28';
    ctx.lineWidth = 1;
    ctx.strokeRect(8, minY - 22, 70, 18);
    ctx.fillStyle = '#e8c878';
    ctx.font = '700 0.8rem system-ui';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(heightM + 'm  ' + state.barrels.filter(function(b) { return !b._fallen; }).length + ' barrels', 14, minY - 13);
    ctx.restore();
  }

  // ─── Game loop ───
  function update() {
    if (state.gameOver) return;

    // Update crane
    if (state.currentBarrel && !state.waitingForNext) {
      state.craneX += state.craneDir * state.craneSpeed;
      if (state.craneX > W / 2 + state.craneRange) {
        state.craneX = W / 2 + state.craneRange;
        state.craneDir = -1;
      } else if (state.craneX < W / 2 - state.craneRange) {
        state.craneX = W / 2 - state.craneRange;
        state.craneDir = 1;
      }
      state.currentBarrel.x = state.craneX;
      state.currentBarrel.y = 60;
    }

    // Wind at higher levels
    state.windPhase += 0.02;
    if (state.level >= 3) {
      var windBase = (state.level - 2) * 0.03;
      state.windForce = Math.sin(state.windPhase * 0.7) * windBase + Math.sin(state.windPhase * 1.3) * windBase * 0.5;
      // Apply wind to barrels
      state.barrels.forEach(function(b) {
        if (!b._fallen) {
          Body.applyForce(b, b.position, { x: state.windForce * 0.0008 * b.mass, y: 0 });
        }
      });
      // Show wind indicator
      var windEl = document.getElementById('wind-indicator');
      if (Math.abs(state.windForce) > 0.05) {
        var arrows = state.windForce > 0 ? '→' : '←';
        var strength = Math.abs(state.windForce) > 0.15 ? 'Strong' : 'Light';
        windEl.textContent = '💨 ' + strength + ' Wind ' + arrows;
        windEl.style.opacity = '1';
      } else {
        windEl.style.opacity = '0';
      }
    } else {
      document.getElementById('wind-indicator').style.opacity = '0';
    }

    // Update physics
    Engine.update(engine, 1000 / 60);

    // Check for fallen barrels continuously
    state.barrels.forEach(function(b) {
      if (!b._fallen && (b.position.y > groundY + 80 || b.position.x < -50 || b.position.x > W + 50)) {
        b._fallen = true;
        if (!state.gameOver) {
          state.gameOver = true;
          state.shakeAmount = 15;
          showGameOver();
        }
      }
    });

    // Update particles
    // (handled in drawParticles)

    // Update height
    var minY = groundY;
    state.barrels.forEach(function(b) {
      if (!b._fallen && b.position.y < minY) minY = b.position.y;
    });
    state.maxHeight = Math.max(state.maxHeight, groundY - minY);

    updateUI();
  }

  function render() {
    ctx.save();

    // Screen shake
    if (state.shakeAmount > 0) {
      var sx = (Math.random() - 0.5) * state.shakeAmount;
      var sy = (Math.random() - 0.5) * state.shakeAmount;
      ctx.translate(sx, sy);
      state.shakeAmount *= 0.9;
      if (state.shakeAmount < 0.5) state.shakeAmount = 0;
    }

    drawBackground();
    drawWind();
    drawHeightMarkers();

    // Draw settled barrels
    state.barrels.forEach(function(b) {
      if (!b._fallen) {
        drawBarrel(b.position.x, b.position.y, b.angle, b.hue, BARREL_W, BARREL_H, false);
      }
    });

    // Draw crane
    drawCrane(state.craneX);

    // Draw current (ghost) barrel
    if (state.currentBarrel && !state.waitingForNext) {
      drawBarrel(state.currentBarrel.x, state.currentBarrel.y, 0, state.currentBarrel.hue, state.currentBarrel.w, state.currentBarrel.h, true);
    }

    drawParticles();

    ctx.restore();
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  // Start
  initGame();
  loop();

})();
</script>
